services:
  - type: web
    name: orbitlist-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run prisma:generate --workspace server && npm run build --workspace server
    preDeployCommand: npm exec prisma migrate deploy --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: REFRESH_SESSION_TTL_DAYS
        value: "30"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: none
      - key: AUTH_COOKIE_DOMAIN
        sync: false
      - key: ALLOWED_CORS_ORIGINS
        sync: false
      - key: JSON_BODY_LIMIT_MB
        value: "8"
      - key: AUTH_RATE_LIMIT_WINDOW_MINUTES
        value: "15"
      - key: AUTH_RATE_LIMIT_MAX
        value: "25"
      - key: MESSAGE_RATE_LIMIT_WINDOW_MINUTES
        value: "1"
      - key: MESSAGE_RATE_LIMIT_MAX
        value: "20"
      - key: UPLOAD_RATE_LIMIT_WINDOW_MINUTES
        value: "10"
      - key: UPLOAD_RATE_LIMIT_MAX
        value: "15"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: uploads
      - key: SUPABASE_STORAGE_FOLDER
        value: marketplace-media
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_FEATURED_LISTING_PRICE_USD
        value: "19"
      - key: STRIPE_CURRENCY
        value: usd
      - key: STRIPE_DEFAULT_CONNECTED_ACCOUNT_COUNTRY
        value: US
      - key: STRIPE_CONNECT_REFRESH_URL
        sync: false
      - key: STRIPE_CONNECT_RETURN_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
